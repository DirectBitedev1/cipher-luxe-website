<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPHER LUXE | Haute Event Architecture</title>
  
  <!-- Elite Cinematic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       HAUTE COUTURE DESIGN TOKENS
       ========================================================================== */
    :root {
      --bg: #070408;
      --bg-matte: #0c080e;
      --glass-obsidian: rgba(12, 8, 14, 0.45);
      --glass-border: rgba(255, 255, 255, 0.04);
      --text-pure: #ffffff;
      --text-muted: #9e93a7;
      --text-dim: #5c5363;
      
      /* Precious Metal Accents */
      --luxury-gold: #e2c995;
      --luxury-gold-deep: #bfa36b;
      --luxury-platinum: #e3e8f0;
      --luxury-rosegold: #e8a2a2;
      
      --font-display: 'Cinzel', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --container: 1240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-pure);
      line-height: 1.62;
      overflow-x: hidden;
      letter-spacing: -0.01em;
    }

    a { color: inherit; text-decoration: none; }
    button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }

    .container {
      width: min(var(--container), calc(100% - 48px));
      margin: 0 auto;
    }

    /* ==========================================================================
       CINEMATIC APERTURE REVEAL SHUTTER (LOADING SEQUENCE)
       ========================================================================== */
    #aperture-shutter {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
    }
    #aperture-shutter.open {
      transform: translateY(-100%);
    }
    .shutter-logo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      color: var(--luxury-gold);
      opacity: 0;
      animation: pulseReveal 2s ease-in-out forwards;
    }
    @keyframes pulseReveal {
      0% { opacity: 0; letter-spacing: 0.1em; filter: blur(8px); }
      50% { opacity: 1; filter: blur(0); }
      100% { opacity: 0; letter-spacing: 0.3em; }
    }

    /* ==========================================================================
       ARCHITECTURAL HEADER NAVIGATION MODULE
       ========================================================================== */
    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 90;
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      background: rgba(7, 4, 8, 0.2);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 90px;
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-crest {
      width: 24px;
      height: 24px;
      border: 1px solid var(--luxury-gold);
      transform: rotate(45deg);
      display: grid;
      place-items: center;
    }
    .brand-crest::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--luxury-gold);
      border-radius: 50%;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 40px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-muted);
    }
    .main-nav a {
      position: relative;
      transition: color 0.3s ease;
    }
    .main-nav a::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      width: 0;
      height: 1px;
      background: var(--luxury-gold);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    .main-nav a:hover { color: var(--luxury-gold); }
    .main-nav a:hover::after { width: 100%; }

    /* Ultra Luxe Button Base */
    .btn-luxe {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 32px;
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-luxe-primary {
      background: linear-gradient(135deg, var(--luxury-gold-deep), var(--luxury-gold));
      color: #000;
      font-weight: 700;
    }
    .btn-luxe-primary:hover {
      box-shadow: 0 12px 30px rgba(226, 201, 149, 0.25);
      transform: translateY(-2px);
    }
    .btn-luxe-outline {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.01);
      color: var(--text-pure);
    }
    .btn-luxe-outline::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--text-pure);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: -1;
    }
    .btn-luxe-outline:hover { color: #000; }
    .btn-luxe-outline:hover::before { transform: scaleX(1); transform-origin: left; }

    /* ==========================================================================
       INTERACTIVE CINEMATIC HERO ARENA
       ========================================================================== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding-top: 100px;
    }

    .hero-video-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .hero-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.24;
      transform: scale(1.05);
      transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .hero-tint-matrix {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(to bottom, rgba(7,4,8,0.4), var(--bg) 95%);
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 60px;
      width: 100%;
    }

    /* Typography Entrance States */
    .hero-copy {
      animation: maskUpReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes maskUpReveal {
      0% { opacity: 0; transform: translateY(40px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .eyebrow-luxury {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--luxury-gold);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .eyebrow-luxury::before {
      content: "";
      width: 30px;
      height: 1px;
      background: currentColor;
    }

    .hero-copy h1 {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 5.8vw, 5.8rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin-top: 24px;
      color: var(--text-pure);
    }
    .hero-copy h1 span {
      display: block;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.06em;
      background: linear-gradient(to right, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-copy p {
      font-size: 1.05rem;
      font-weight: 300;
      color: var(--text-muted);
      max-width: 540px;
      margin-top: 28px;
    }

    .hero-action-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 40px;
    }

    .hud-atmosphere-selector {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(12, 8, 14, 0.4);
      padding: 24px 16px;
      border-radius: 0 0 30px 30px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(30px);
    }
    .hud-trigger {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      border-radius: 12px;
      border: 1px solid transparent;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hud-trigger.active {
      color: var(--luxury-gold);
      border-color: var(--glass-border);
      background: rgba(255,255,255,0.03);
    }
  </style>
</head>
<body>

      <div class="shutter-logo">CIPHER LUXE</div>
    </div>

    <!-- Header -->
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">
          <div class="brand-crest"></div>

        </div>
        <nav class="main-nav">
          <a href="#">Aesthetics</a>
          <a href="#">Philosophy</a>
          <a href="#">Portfolio</a>
          <a href="#">Contact</a>
        </nav>
        <button class="btn-luxe btn-luxe-outline">Enquire Now</button>
      </div>
    </header>
