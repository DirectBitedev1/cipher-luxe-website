<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHER LUXE | Haute Event Architecture</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #070408;
            --bg-matte: #0c080e;
            --glass-obsidian: rgba(12, 8, 14, 0.45);
            --glass-border: rgba(255, 255, 255, 0.04);
            --text-pure: #ffffff;
            --text-muted: #9e93a7;
            --text-dim: #5c5363;
            --luxury-gold: #e2c995;
            --luxury-gold-deep: #bfa36b;
            --luxury-platinum: #e3e8f0;
            --luxury-rosegold: #e8a2a2;
            --font-display: 'Cinzel', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --container: 1240px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; background-color: var(--bg); }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text-pure); line-height: 1.62; overflow-x: hidden; }
        a { color: inherit; text-decoration: none; }

        .container { width: min(var(--container), calc(100% - 48px)); margin: 0 auto; }

        /* Loading Shutter */
        #aperture-shutter {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
        }
        #aperture-shutter.open { transform: translateY(-100%); }

        /* Header */
        .site-header { position: absolute; top: 0; width: 100%; z-index: 90; border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(20px); background: rgba(7, 4, 8, 0.2); }
        .nav-wrap { display: flex; align-items: center; justify-content: space-between; min-height: 90px; }
        .brand { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; font-size: 1.05rem; }
        .main-nav { display: flex; gap: 40px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-muted); }
        .main-nav a:hover { color: var(--luxury-gold); }

        /* Hero */
        .hero { position: relative; min-height: 100vh; display: flex; align-items: center; overflow: hidden; padding-top: 100px; }
        .hero-copy h1 { font-family: var(--font-display); font-size: clamp(3.2rem, 5.8vw, 5.8rem); line-height: 0.95; margin-top: 24px; }
        .hero-copy h1 span { display: block; font-weight: 900; font-style: italic; background: linear-gradient(to right, #ffffff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-luxe { display: inline-flex; align-items: center; padding: 0 32px; min-height: 52px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; border: 1px solid var(--luxury-gold); color: var(--luxury-gold); margin-top: 40px; transition: 0.3s; }
        .btn-luxe:hover { background: var(--luxury-gold); color: #000; }
    </style>
</head>
<body>

    <div id="aperture-shutter">
        <div class="shutter-logo" style="font-family: 'Cinzel'; color: #e2c995; letter-spacing: 0.3em;">CIPHER LUXE</div>
    </div>

    <header class="site-header">
        <div class="container">
            <nav class="nav-wrap">
                <div class="brand">CIPHER LUXE</div>
                <div class="main-nav">
                    <a href="#philosophy">Philosophy</a>
                    <a href="#portfolio">Portfolio</a>
                    <a href="#contact">Contact</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero-copy">
                    <div class="eyebrow-luxury" style="color: var(--luxury-gold); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;">Haute Event Architecture</div>
                    <h1>Designing <span>Eternal Moments</span></h1>
                    <p style="max-width: 500px; color: var(--text-muted); margin-top: 20px;">We architect high-concept environments for the world's most discerning individuals.</p>
                    <a href="#contact" class="btn-luxe">Inquire Now</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('aperture-shutter').classList.add('open');
            }, 1500);
        });
    </script>
</body>
</html>
