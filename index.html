<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHER LUXE | Haute Event Architecture</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* [PASTE YOUR CSS HERE - I have included the core styles below for immediate fix] */
        :root {
            --bg: #070408;
            --luxury-gold: #e2c995;
            --text-pure: #ffffff;
            --text-muted: #9e93a7;
            --font-display: 'Cinzel', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background-color: var(--bg); color: var(--text-pure); font-family: var(--font-sans); overflow-x: hidden; }
        
        #aperture-shutter {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
        }
        #aperture-shutter.open { transform: translateY(-100%); }
        
        .site-header { position: absolute; width: 100%; z-index: 90; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .container { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }
        .nav-wrap { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-family: var(--font-display); letter-spacing: 0.2em; font-weight: 700; }
        
        .hero { min-height: 100vh; display: flex; align-items: center; position: relative; }
        .hero-copy h1 { font-family: var(--font-display); font-size: clamp(3rem, 8vw, 6rem); line-height: 1; }
        .hero-copy span { display: block; font-style: italic; color: var(--luxury-gold); }
    </style>
</head>
<body>

    <!-- Loading Shutter -->
    <div id="aperture-shutter">
        <div class="shutter-logo">CIPHER LUXE</div>
    </div>

    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <nav class="nav-wrap">
                <div class="brand">CIPHER LUXE</div>
                <div class="main-nav">
                    <a href="#about">Philosophy</a>
                    <a href="#work">Portfolio</a>
                    <a href="#contact">Contact</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <main>
        <section class="hero">
            <div class="container">
                <div class="hero-copy">
                    <div class="eyebrow-luxury">Event Architecture</div>
                    <h1>Designing <span>Eternal Moments</span></h1>
                    <p>Curating ultra-high-end experiences through the lens of cinematic design.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Reveal page after "loading"
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('aperture-shutter').classList.add('open');
            }, 2000);
        });
    </script>
</body>
</html>
