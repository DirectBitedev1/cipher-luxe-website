<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHER LUXE | Haute Event Architecture</title>
    
    <!-- Ultra Luxe Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #070408; --bg-matte: #0c080e; --text-pure: #ffffff; --text-muted: #9e93a7;
            --luxury-gold: #e2c995; --luxury-gold-deep: #bfa36b; --glass-border: rgba(255, 255, 255, 0.05);
            --font-display: 'Cinzel', serif; --font-sans: 'Plus Jakarta Sans', sans-serif;
            --container: 1200px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; background-color: var(--bg); }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text-pure); line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; transition: 0.3s ease; }
        img { max-width: 100%; height: auto; display: block; filter: grayscale(20%); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .container { width: min(var(--container), 90%); margin: 0 auto; }

        /* Cinematic Loading Shutter */
        #aperture-shutter {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
        }
        #aperture-shutter.open { transform: translateY(-100%); }
        .shutter-logo { font-family: var(--font-display); color: var(--luxury-gold); letter-spacing: 0.5em; font-size: 1.5rem; animation: pulse 2s infinite alternate; }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* Sticky Header */
        .site-header { position: sticky; top: 0; z-index: 90; background: rgba(7,4,8,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
        .nav-wrap { display: flex; justify-content: space-between; align-items: center; height: 90px; }
        .brand { font-family: var(--font-display); letter-spacing: 0.3em; font-weight: 700; font-size: 1.2rem; }
        .main-nav a { margin-left: 35px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted); }
        .main-nav a:hover { color: var(--luxury-gold); }

        /* Hero Arena */
        .hero { padding: 150px 0 100px; text-align: center; }
        .eyebrow { font-size: 0.7rem; letter-spacing: 0.4em; color: var(--luxury-gold); text-transform: uppercase; margin-bottom: 20px; }
        .hero h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 7vw, 5.5rem); line-height: 0.95; }
        .hero h1 span { display: block; font-style: italic; color: var(--luxury-gold); font-weight: 900; }

        /* Services Grid */
        .services { padding: 100px 0; background: var(--bg-matte); }
        .section-title { font-family: var(--font-display); text-align: center; margin-bottom: 60px; letter-spacing: 0.3em; text-transform: uppercase; }
        .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .service-card { padding: 50px 40px; border: 1px solid var(--glass-border); transition: 0.5s; position: relative; overflow: hidden; }
        .service-card:hover { transform: translateY(-10px); border-color: var(--luxury-gold); background: rgba(255,255,255,0.02); }
        .service-card h3 { font-family: var(--font-display); color: var(--luxury-gold); margin-bottom: 15px; letter-spacing: 0.1em; }
        .service-card p { color: var(--text-muted); font-size: 0.9rem; font-weight: 300; }

        /* Portfolio Gallery */
        .gallery { padding: 100px 0; }
        .gallery-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
        .gallery-item { position: relative; overflow: hidden; border: 1px solid var(--glass-border); }
        .item-lg { grid-column: span 8; height: 500px; }
        .item-sm { grid-column: span 4; height: 500px; }
        .item-md { grid-column: span 6; height: 400px; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-item:hover img { transform: scale(1.05); filter: grayscale(0%); }
        .img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,4,8,0.9), transparent); display: flex; align-items: flex-end; padding: 30px; opacity: 0; transition: 0.4s; }
        .gallery-item:hover .img-overlay { opacity: 1; }

        /* Inquiry Form */
        .inquiry { padding: 100px 0; background: var(--bg-matte); }
        .inquiry-form { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .inquiry-form input, .inquiry-form textarea {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            padding: 20px; color: #fff; font-family: var(--font-sans); outline: none; transition: 0.3s;
        }
        .inquiry-form input:focus { border-color: var(--luxury-gold); }
        .btn-submit {
            background: linear-gradient(135deg, var(--luxury-gold-deep), var(--luxury-gold)); color: #000; 
            padding: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3em; border: none; cursor: pointer;
        }

        /* Footer & Socials */
        .site-footer { padding: 80px 0; text-align: center; border-top: 1px solid var(--glass-border); }
        .social-links { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; }
        .social-links a:hover { color: var(--luxury-gold); }
        
        /* Floating WhatsApp */
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px; z-index: 100;
            background: #25d366; color: #fff; padding: 15px 25px; border-radius: 50px;
            font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .gallery-grid { display: flex; flex-direction: column; }
            .item-lg, .item-sm, .item-md { height: 300px; }
            .main-nav { display: none; }
        }
    </style>
</head>
<body>

    <div id="aperture-shutter"><div class="shutter-logo">CIPHER LUXE</div></div>

    <a href="https://wa.me/YOUR_NUMBER" class="whatsapp-float" target="_blank">WHATSAPP ENQUIRY</a>

    <header class="site-header"><div class="container"><nav class="nav-wrap">
        <div
